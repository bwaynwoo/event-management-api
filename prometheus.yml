global:
  scrape_interval: 15s

scrape_configs:
  - job_name: event-service
    static_configs:
      - targets: ["host.docker.internal:5257"]
    metrics_path: /metrics

  - job_name: booking-service
    static_configs:
      - targets: ["host.docker.internal:5237"]
    metrics_path: /metrics

  - job_name: user-service
    static_configs:
      - targets: ["host.docker.internal:5270"]
    metrics_path: /metrics