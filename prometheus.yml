global:
  scrape_interval: 15s

scrape_configs:
  - job_name: event-service
    static_configs:
      - targets: ["events-service:5257"]
    metrics_path: /metrics

  - job_name: booking-service
    static_configs:
      - targets: ["bookings-service:5237"]
    metrics_path: /metrics

  - job_name: user-service
    static_configs:
      - targets: ["users-service:5270"]
    metrics_path: /metrics